databaseChangeLog:
  - changeSet:
      id: 001-tasks
      author: kruzetech
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: description, type: varchar(2000) }
              - column: { name: status, type: varchar(20), defaultValue: TODO, constraints: { nullable: false } }
              - column: { name: due_date, type: timestamp with time zone }
              - column: { name: user_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: tasks
            indexName: idx_tasks_user_status
            columns:
              - column: { name: user_id }
              - column: { name: status }
