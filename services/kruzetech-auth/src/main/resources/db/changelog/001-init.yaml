databaseChangeLog:
  - changeSet:
      id: 001-users
      author: boilerplate
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(255), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_users_email } }
              - column: { name: password, type: varchar(255) }
              - column: { name: first_name, type: varchar(255) }
              - column: { name: last_name, type: varchar(255) }
              - column: { name: role, type: varchar(20), defaultValue: USER, constraints: { nullable: false } }
              - column: { name: is_active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: avatar, type: varchar(1024) }
              - column: { name: firebase_uid, type: varchar(128), constraints: { unique: true, uniqueConstraintName: uq_users_firebase_uid } }
              - column: { name: last_login, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: users
            indexName: idx_users_role
            columns:
              - column: { name: role }
  - changeSet:
      id: 002-refresh-tokens
      author: boilerplate
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: token, type: varchar(1024), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_refresh_tokens_token } }
              - column: { name: user_id, type: varchar(36), constraints: { nullable: false, foreignKeyName: fk_refresh_tokens_user, references: users(id), deleteCascade: true } }
              - column: { name: expires_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user
            columns:
              - column: { name: user_id }
