name: Backend CI - Test & Build

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'services/**'
      - 'infra/**'
      - 'ci/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'services/**'
      - 'infra/**'
      - 'ci/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kruzetech-auth:
              - 'services/kruzetech-auth/**'
              - 'ci/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            kruzetech-task:
              - 'services/kruzetech-task/**'
              - 'ci/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            kruzetech-vocab:
              - 'services/kruzetech-vocab/**'
              - 'ci/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            kruzetech-gateway:
              - 'services/kruzetech-gateway/**'
              - 'ci/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

      - name: Determine Target Services
        id: set-services
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$CHANGES" ] || [ "$CHANGES" = "[]" ]; then
            echo 'services=["kruzetech-auth","kruzetech-task","kruzetech-vocab","kruzetech-gateway"]' >> $GITHUB_OUTPUT
          else
            echo "services=$CHANGES" >> $GITHUB_OUTPUT
          fi

  test-and-build:
    name: Test & Build (${{ matrix.service }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Run Tests
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --no-daemon --info

      - name: Build Executable JAR
        working-directory: services/${{ matrix.service }}
        run: ./gradlew bootJar -x test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Check & Cache)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.service }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Docker Image (Registry Gate)
        run: |
          echo "==> Docker Image for ${{ matrix.service }} built successfully!"
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          IMAGE_REF="ghcr.io/${{ github.repository }}/${{ matrix.service }}:${IMAGE_TAG}"
          
          docker tag "${{ matrix.service }}:ci-test" "$IMAGE_REF"
          
          if [ -z "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "::error title=Push Gate::[EXPECTED IN CI] Authentication token (REGISTRY_TOKEN) not set. CI verified: Tests PASS, Jar PASS, Docker Build PASS. Pipeline intentionally stops at push gate."
            exit 1
          fi

          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_REF"
          echo "Successfully pushed: $IMAGE_REF"

      - name: Upload Test Report Artifact (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/test/
          retention-days: 7
