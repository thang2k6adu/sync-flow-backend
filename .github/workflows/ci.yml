name: Backend CI - Test & Build

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'services/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'services/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - kruzetech-auth
          - kruzetech-task
          - kruzetech-vocab
          - kruzetech-gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Run Tests
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --no-daemon --info

      - name: Build Executable JAR
        working-directory: services/${{ matrix.service }}
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload Test Report Artifact (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/test/
          retention-days: 7
